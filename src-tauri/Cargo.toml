[package]
name = "notespace"
version = "0.1.3"
description = "NoteSpace — 3D knowledge base with nested groups, levels and tags"
authors = ["Alyuev"]
edition = "2021"

[lib]
name = "notespace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Smaller installer.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
